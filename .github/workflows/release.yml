name: Release

# Push a tag matching the version in package.json (for example v0.5.0) to publish it.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Git identity for the test repos
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - run: npm test
      - run: npx --yes @vscode/vsce package --out amend-any-commit.vsix
      # The Source Control Graph menu is a proposed API: it only shows where VS Code allows it,
      # the other entry points work everywhere.
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath amend-any-commit.vsix --allow-proposed-apis contribSourceControlHistoryItemMenu
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish amend-any-commit.vsix
      - name: Attach the package to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" amend-any-commit.vsix --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
    permissions:
      contents: write
