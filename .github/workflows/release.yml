name: Release

# Push a tag matching the version in package.json (for example v0.5.0) to publish it.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
    # At job level so the Open VSX step can skip itself while the secret is not set.
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Git identity for the test repos
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - run: npm test
      - run: npx --yes @vscode/vsce package --out amend-any-commit.vsix
      # The Source Control Graph menu is a proposed API: it only shows where VS Code allows it,
      # the other entry points work everywhere.
      # Marketplace Trusted Publishing: GitHub's OIDC token replaces a stored PAT. Needs a policy for
      # this repository and release.yml on the publisher's Trusted Publishing page.
      - name: Publish to the VS Code Marketplace
        run: npx --yes @vscode/vsce publish --oidc --packagePath amend-any-commit.vsix --allow-proposed-apis contribSourceControlHistoryItemMenu
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish amend-any-commit.vsix
      - name: Attach the package to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" amend-any-commit.vsix --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
